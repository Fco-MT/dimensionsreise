<style>
:root{
  --night:#060a1c; --night2:#0c1433; --panel:#0f1a3c; --panel-line:#2a3a72; --text:#e9eeff; --text-mute:#a9b6e0;
  --sky:#7fb4ff; --violet:#c08bff; --mint:#5fe0b0;
  --serif:"Source Serif 4","Noto Serif TC","Songti TC",Georgia,serif;
  --sans:"Atkinson Hyperlegible","Noto Sans TC","PingFang TC","Microsoft JhengHei","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{background:var(--night);background-image:radial-gradient(60% 45% at 85% 0%,#1b2a6b88,transparent 70%),radial-gradient(50% 40% at 0% 100%,#3a1b6b66,transparent 70%),var(--stars,none);background-size:auto,auto,cover;background-attachment:fixed;color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45}
.wrap{max-width:1560px;margin:0 auto;padding-inline:clamp(16px,1.6vw,26px);padding-block:16px 28px;display:flex;flex-direction:column;gap:14px}
button,input{font:inherit}
button:focus-visible,input:focus-visible{outline:3px solid #ffd166;outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand svg{flex:none;color:var(--sky)}
.brand h1{font-family:var(--serif);font-weight:700;font-size:clamp(1.9rem,3.2vw,2.9rem);line-height:1;margin:0;letter-spacing:.005em}
.brand p{margin:4px 0 0;color:var(--text-mute);font-size:.92rem}
.tagline{flex:1 1 260px;margin:0;color:var(--sky);font-size:1.02rem;max-width:34ch}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lang{display:flex;border:1.5px solid #3f62b8;border-radius:10px;overflow:hidden;background:#0c1740}
.lang button{border:0;background:transparent;color:var(--text-mute);padding:9px 14px;cursor:pointer;border-left:1px solid #2a3a72}
.lang button:first-child{border-left:0}
.lang button[aria-pressed="true"]{background:#1c3f95;color:#fff;font-weight:700}
.tool{display:flex;align-items:center;gap:8px;border:1.5px solid var(--panel-line);background:#0f1a3ccc;color:var(--text);border-radius:10px;padding:9px 14px;cursor:pointer}
.tool:hover,.lang button:hover{background:#1a2a5e}

.cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:auto auto auto auto auto;gap:8px}
.col{--card:#fbf3e4;--soft:#ffffffa8;--ink:#2b2418;--edge:#e9d9b8;grid-row:span 5;display:grid;grid-template-rows:subgrid;gap:8px;background:var(--card);color:var(--ink);border:2px solid var(--edge);border-radius:14px;padding:8px;cursor:pointer;min-width:0;transition:box-shadow .2s,transform .2s}
.col[data-ch="1"]{--card:#d8e9fa;--edge:#a9cdf2;--ink:#1c2a3d}
.col[data-ch="2"]{--card:#fde3cc;--edge:#f3c08f;--ink:#33261a}
.col[data-ch="3"]{--card:#d3eee3;--edge:#8fd6bb;--ink:#12302b}
.col[data-ch="4"]{--card:#e0d5f8;--edge:#b79bf0;--ink:#241a4a}
.col.sel{box-shadow:0 0 0 3px #fff,0 0 26px 4px var(--edge)}
.col header{text-align:center;padding:2px 4px 0}
.col h2{margin:0;font-size:clamp(1.05rem,1.45vw,1.5rem);font-weight:700;line-height:1.15}
.col header p{margin:2px 0 0;font-size:.92rem}
.scene{position:relative;border-radius:9px;overflow:hidden;background:#fff}
canvas{display:block;width:100%;max-width:100%}
.scene canvas{aspect-ratio:16/9}
.see{background:var(--soft);border-radius:10px;padding:6px 6px 7px;display:flex;flex-direction:column;gap:4px}
.see h3{margin:0;text-align:center;font-size:.86rem;font-weight:700;line-height:1.2;min-height:2.4em;display:grid;place-items:center}
.see canvas{aspect-ratio:400/110;border-radius:7px}
.see.inner{background:#ffffff8c;margin-top:2px}
.see p{margin:0;text-align:center;font-size:.76rem;line-height:1.25;opacity:.8;min-height:2.5em}
.bubble{position:absolute;top:7px;right:7px;max-width:64%;background:#fff;color:#1d1d1d;border-radius:12px;padding:4px 10px;font-size:.8rem;line-height:1.25;text-align:center;box-shadow:0 1px 4px #0005}
.bubble::after{content:"";position:absolute;left:18px;bottom:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0;border-left-width:2px}
.bubble:empty,.nobub .bubble{display:none}
.view{background:color-mix(in srgb,var(--edge) 38%,#fff 30%);border-radius:10px;padding:6px 6px 10px;display:flex;flex-direction:column;gap:6px}
.view h3{margin:2px 0 0;text-align:center;font-size:.92rem;font-weight:700;min-height:2.5em;display:grid;place-items:center;line-height:1.2}
.view p,.tin{margin:0;text-align:center;font-size:.86rem;text-wrap:pretty}
.view p{padding:2px 6px}
.tin{background:var(--soft);border-radius:10px;padding:10px 10px}

.info{display:grid;grid-template-columns:1.35fr 1.25fr .85fr .95fr;gap:12px}
.card{border:1.5px solid var(--panel-line);background:#0f1a3cd9;border-radius:12px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 6px;font-size:1.02rem}
.card p{margin:0;color:var(--text-mute);font-size:.9rem}
.cat{display:flex;gap:16px;align-items:center}
.cat canvas{flex:none;width:118px;height:118px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#f6e7cf,#c9a877);border:2px solid #42558f}
.cat h3{font-size:1.1rem}
.do{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:start}
.do h3{grid-column:1/-1}
.btns{display:flex;flex-direction:column;gap:6px}
.btns button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--text);cursor:pointer;padding:2px 4px 2px 0;border-radius:8px;text-align:left}
.btns .ic{display:grid;place-items:center;width:40px;height:26px;border-radius:6px;background:#2a3868;color:#fff;flex:none}
.btns button[aria-pressed="true"] .ic{background:#3f6fe0}
.btns button:hover .ic{background:#4a5da0}
.prog{grid-column:1/-1;display:flex;align-items:center;gap:10px;color:var(--text-mute);font-size:.85rem}
.prog input{flex:1;min-width:0;accent-color:var(--sky)}
.card.prin{border-color:#7a3fd0;background:#1a0f45d9}.card.prin h3{color:var(--violet)}
.card.memo{border-color:#2f9c78;background:#0a2a2ad9}.card.memo h3{color:var(--mint)}
.hrow{display:flex;gap:10px;align-items:flex-start}.hrow svg{flex:none;margin-top:1px}
.memo ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;color:var(--text-mute);font-size:.88rem}
.memo li{padding-left:22px;position:relative}
.memo li::before{content:"";position:absolute;left:2px;top:.35em;width:10px;height:5px;border-left:2px solid var(--mint);border-bottom:2px solid var(--mint);transform:rotate(-45deg)}

.bar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.6fr);gap:12px;align-items:stretch}
.tabs{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:6px;padding:6px;border-radius:12px;border:1.5px solid #4a6fc0;background:#16306acc}
.tabs button{border:0;border-radius:8px;background:#1d3f66;color:#dbe8ff;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.15;min-width:0}
.tabs button b{font-size:1.15rem}.tabs button span{font-size:.82rem;overflow-wrap:anywhere;text-align:center}
.tabs button[aria-selected="true"]{background:#e6f0ff;color:#10204a}
.tabs #miniPlay{background:#3f6fe0;color:#fff;justify-content:center;padding-inline:12px}
.speed{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.speed .sl{flex:1 1 220px;display:flex;flex-direction:column;gap:2px;min-width:0}
.speed input{width:100%;accent-color:var(--sky)}
.speed .ends{display:flex;justify-content:space-between;font-size:.78rem;color:var(--text-mute)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;border-top:1px solid #24325f;padding-top:12px;color:var(--text-mute);font-size:.9rem}
.foot em{font-family:var(--serif);font-style:italic;color:var(--text)}

dialog{border:1.5px solid var(--panel-line);border-radius:14px;background:#0f1a3c;color:var(--text);padding:20px 22px;max-width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:#030611cc}
dialog h2{font-family:var(--serif);margin:0 0 10px;font-size:1.4rem}
dialog p{color:var(--text-mute);margin:0 0 10px}
dialog fieldset{border:1px solid var(--panel-line);border-radius:10px;margin:0 0 12px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
dialog legend{padding:0 6px;font-weight:700}
dialog label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
dialog .opt{margin:0 0 8px}
.dlgClose{margin-top:6px;border:0;border-radius:8px;background:#3f6fe0;color:#fff;padding:8px 18px;cursor:pointer;font-weight:700}
:lang(zh-Hant) body{line-height:1.6}
:lang(zh-Hant) .brand h1{letter-spacing:.06em}

/* eine Dimension groß */
.cols.focus{grid-template-columns:minmax(0,1fr);grid-template-rows:none}
.cols.focus .col{display:none;grid-row:auto}
.cols.focus .col.sel{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto auto;box-shadow:none;cursor:default;gap:10px;padding:12px}
.cols.focus .col.sel header{grid-column:1/-1}
.cols.focus .col.sel > .scene{grid-column:1;grid-row:2;align-self:start}
.cols.focus .col.sel .view{grid-column:2;grid-row:2/5;align-self:start}
.cols.focus .col.sel .see{grid-column:1;grid-row:3}
.cols.focus .col.sel .see h3,.cols.focus .col.sel .see p{min-height:0;font-size:1rem}
.cols.focus .col.sel .tin{grid-column:1;grid-row:4;align-self:start}
.cols.focus .col.sel h2{font-size:1.7rem}.cols.focus .col.sel .view p,.cols.focus .col.sel .tin{font-size:1.05rem}
.cols.focus .bubble{font-size:1rem}

@media (max-width:1180px){.info{grid-template-columns:1fr 1fr}}
@media (max-width:999px){
  .bar{order:1;grid-template-columns:1fr}.cols{order:2}.info{order:3}.foot{order:4}
  .cols{grid-template-columns:minmax(0,1fr);grid-template-rows:none;max-width:640px;width:100%;margin-inline:auto}
  .col{display:none;grid-row:auto;grid-template-rows:none;cursor:default}
  .col.sel{display:grid;box-shadow:none}
  .view p,.tin{font-size:.95rem}.bubble{font-size:.9rem}
}
@media (max-width:640px){.info{grid-template-columns:1fr}.cat canvas{width:88px;height:88px}.do{grid-template-columns:1fr}
  .cols.focus .col.sel{grid-template-columns:1fr}.cols.focus .col.sel > .scene,.cols.focus .col.sel .view,.cols.focus .col.sel .see,.cols.focus .col.sel .tin{grid-column:1;grid-row:auto}
  .tabs{grid-template-columns:auto repeat(5,minmax(0,1fr));gap:4px;padding:4px}.tabs button span{font-size:.68rem}}
@media (prefers-reduced-motion:reduce){.col{transition:none}}
</style>
